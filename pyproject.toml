[project]
name = "adote"
version = "0.1.0"
description = "Plataforma de adoção de animais: quem resgata divulga, quem quer adotar pede, quem divulgou decide."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Eduardo Lima", email = "dudulj15@gmail.com" }]
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0,<6.1",
    "fontawesomefree>=6.6.0",
    "gunicorn>=23.0.0",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "whitenoise>=6.12.0",
]

[project.urls]
Repository = "https://github.com/edududs/Adote"
Changelog = "https://github.com/edududs/Adote/blob/master/CHANGELOG.md"
Issues = "https://github.com/edududs/Adote/issues"

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "git-cliff>=2.10.0",
    "hypothesis>=6.168.0",
    "poethepoet>=0.48.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]
