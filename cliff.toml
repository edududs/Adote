# git-cliff: builds CHANGELOG.md and the release notes from the Conventional Commits.
# Keep a Changelog format, SemVer versions. Used by scripts/release.sh (docs/runbooks/release.md).

[changelog]
header = """
# Changelog

Formato conforme [Keep a Changelog](https://keepachangelog.com/pt-BR/1.1.0/) e versões conforme
[SemVer](https://semver.org/lang/pt-BR/). Gerado pelo git-cliff a partir dos commits: não editar à mão.

Antes da 1.0 o contrato ainda se move: `MINOR` traz funcionalidade e pode quebrar compatibilidade,
`PATCH` é correção. Commits anteriores à adoção do Conventional Commits não aparecem aqui.
"""
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Não lançado]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.breaking %}**QUEBRA** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor -%}
{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The numbered comment only orders the groups; `striptags` removes it from the output.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Adicionado" },
    { message = "^fix", group = "<!-- 1 -->Corrigido" },
    { message = "^perf", group = "<!-- 2 -->Desempenho" },
    { message = "^refactor", group = "<!-- 3 -->Refatorado" },
    { message = "^docs", group = "<!-- 4 -->Documentação" },
    { message = "^test", group = "<!-- 5 -->Testes" },
    { message = "^(build|ci|chore)", group = "<!-- 6 -->Infraestrutura" },
]

[bump]
# Pre-1.0: a feature bumps MINOR and a breaking change also bumps MINOR, never MAJOR.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
