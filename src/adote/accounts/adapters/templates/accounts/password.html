{% extends "app.html" %}
{% block title %}Trocar senha{% endblock %}
{% block content %}
<div class="box">
  <h2 class="font-vinho">Trocar senha</h2>
  <hr>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/_form_errors.html" %}
    {% for field in form %}{% include "partials/_field.html" %}{% endfor %}
    <button type="submit" class="btn btn-custom-primary">Trocar senha</button>
  </form>
</div>
{% endblock %}
