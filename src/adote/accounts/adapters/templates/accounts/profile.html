{% extends "app.html" %}
{% block title %}Perfil{% endblock %}
{% block content %}
<header class="page-header">
  <div>
    <h1 class="page-title">Seu perfil</h1>
    <p class="page-subtitle">É isso que quem divulga um pet vê quando você pede para adotar.</p>
  </div>
  <div class="flex flex-wrap gap-2">
    <a class="btn btn-primary" href="{% url 'accounts:edit_profile' %}"><i class="fa-solid fa-pen" aria-hidden="true"></i>Editar perfil</a>
    <a class="btn btn-outline" href="{% url 'accounts:password' %}"><i class="fa-solid fa-key" aria-hidden="true"></i>Trocar senha</a>
  </div>
</header>
<div class="max-w-3xl motion-safe:animate-rise">{% include "accounts/_profile_card.html" with person=account %}</div>
{% endblock %}
