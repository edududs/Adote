<div class="field">
  {% if field.label %}<label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-wine-600" aria-hidden="true">*</span><span class="sr-only">(obrigatório)</span>{% endif %}</label>{% endif %}
  {{ field }}
  {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_error">{% for error in field.errors %}<p class="field-error"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
